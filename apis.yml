name: Groups
description: 'Groups (Groups Recover Together, joingroups.com) is a healthcare provider delivering
  outpatient opioid use disorder treatment that combines Suboxone (buprenorphine) medication-assisted
  treatment with weekly group therapy and individual care coordination. Founded in 2014 and backed by
  Bessemer Venture Partners, Groups operates in-person locations nationwide alongside a virtual/telehealth
  care option and a member mobile app, accepting most commercial insurance and Medicaid. It is CARF-accredited
  and focuses on accessible, non-judgmental, long-term recovery. This is a company profile in the API
  Evangelist network; Groups is a direct-to-consumer clinical service and publishes no public developer
  API surface at the time of profiling.'
